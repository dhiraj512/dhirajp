# content/resources/snippets.yaml
- title: "Array to Object"
  description: "Convert an array to an object with keys as index"
  language: "typescript"
  fileName: "index.ts"
  highlightLines: "1-3"
  highlightWords: ["/array/", "/object/2", "/reduce/#v"]
  code: |
    const array = ["apple", "banana", "orange"];

    const object = array.reduce((acc, value, index) => {
      acc[`fruit ${index + 1}`] = value;
      return acc;
    }, {} as { [key: string]: string });

      console.log(object);
  tags: ["react", "hooks", "api"]

- title: "Object to Array"
